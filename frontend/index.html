<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>THYNORA</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231F3BAE' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5v16'/%3E%3Cpath d='M16 13h2'/%3E%3Cpath d='M16 9h2'/%3E%3Cpath d='M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z'/%3E%3Cpath d='M6 13h2'/%3E%3Cpath d='M6 9h2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Googleでのサインインに使うJS SDK。クライアントID未設定時はそもそもボタンが
         無効化されるので、読み込めなくても本体の動作には影響しない。 -->
    <script async src="https://accounts.google.com/gsi/client"></script>
    <!-- 起動演出: krasis.xyz と同じニューラルネットワークの投影(shared/krasis-splash/ の部品)。
         CSPのscript-srcが'self'のみなので、JS/CSSはどちらもpublic/から同一オリジンで読み込む。

         html/bodyの背景は、本体のCSS(style.css)が読み込まれるより前から
         アプリと同じ色にしておく。これが無いと、読み込みが遅い回線などで
         演出が先に終わってしまった場合に、ブラウザ既定の白背景がむき出しになる
         (「起動演出の後に白塗りになる」バグの原因)。 -->
    <link rel="stylesheet" href="/krasis-splash.css" />
    <style>
      html, body {
        background: #F6F4EF;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #121314; }
      }
    </style>
  </head>
  <body>
    <!-- JSより先に黒い画面を出すため、起動演出の枠はHTMLに直接置く。
         描画は krasis-splash.js、消すタイミングは intro-splash.js が担当する。 -->
    <div id="nn-splash" aria-hidden="true">
      <canvas></canvas>
      <div class="nn-logo">
        <svg class="nn-mk" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5.5 L18.5 12 M5 18.5 L18.5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="5" cy="5.5" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="18.5" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="18.5" cy="12" r="3.3" fill="#e6ab84"/></svg>
        <b>THYNORA</b><span>THINK BEYOND.</span>
      </div>
      <div class="nn-log"></div>
      <div class="nn-skip">click to skip</div>
    </div>
    <div id="root"></div>
    <!-- 起動演出の描画と、消すタイミングの制御。CSPのscript-srcが'unsafe-inline'を含まないため
         インラインscriptでは実行できず、'self'から読み込める外部ファイルにしてある
         (詳細はintro-splash.js内のコメント参照)。 -->
    <script src="/krasis-splash.js"></script>
    <script src="/intro-splash.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

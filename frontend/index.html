<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>THYNORA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2280%22 text-anchor=%22middle%22 x=%2250%22 fill=%22%23000000%22>◆</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Googleでのサインインに使うJS SDK。クライアントID未設定時はそもそもボタンが
         無効化されるので、読み込めなくても本体の動作には影響しない。 -->
    <script async src="https://accounts.google.com/gsi/client"></script>
    <!-- 起動演出: 深いダーク背景の上を、白から金へ抜けるグラデーションの細い光の筋が
         斜めに静かに流れるだけ。丸い光の点滅などは付けず、そのままフェードで本体へ引き渡す。
         style.css(バンドル)を待たずに出したいのでここにインラインで定義する。

         html/bodyの背景も、本体のCSS(style.css)が読み込まれるより前から
         アプリと同じ色にしておく。これが無いと、読み込みが遅い回線などで
         演出の固定タイマーが先に終わってしまった場合に、ブラウザ既定の
         白背景がむき出しになる(「起動演出の後に白塗りになる」バグの原因)。 -->
    <style>
      html, body {
        background: #F6F4EF;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #121314; }
      }

      #intro-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #08090b;
        pointer-events: none;
        opacity: 1;
        transition: opacity .55s cubic-bezier(.4, 0, .2, 1);
      }
      /* 固定時間で消すのではなく、後述のスクリプトがアプリの起動完了を検知してから
         このクラスを付与する(=最低表示時間とアプリの実際の準備完了の両方を待つ)。 */
      #intro-splash.intro-splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .intro-streak {
        position: absolute;
        top: 50%;
        left: 50%;
        height: 1.5px;
        width: var(--len);
        background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          #ffffff 42%,
          #e6ab84 75%,
          rgba(230, 171, 132, 0) 100%);
        filter: drop-shadow(0 0 3px rgba(230, 171, 132, .55));
        transform-origin: 0 50%;
        opacity: 0;
        animation: intro-streak-flow .95s cubic-bezier(.3, 0, .2, 1) var(--delay) forwards;
      }
      @keyframes intro-streak-flow {
        0%   { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(-56vmin); opacity: 0; }
        18%  { opacity: 1; }
        68%  { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(8vmin); opacity: 1; }
        100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(30vmin); opacity: 0; }
      }

      #intro-logo-wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      #intro-logo {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: clamp(26px, 5vw, 42px);
        font-weight: 500;
        letter-spacing: 0.28em;
        color: #ffffff;
        text-shadow: 0 0 24px rgba(230, 171, 132, .35);
        opacity: 0;
        animation: intro-logo-fade 1.1s cubic-bezier(.3, 0, .2, 1) .25s forwards;
      }
      @keyframes intro-logo-fade {
        0%   { opacity: 0; letter-spacing: 0.5em; }
        100% { opacity: 1; letter-spacing: 0.28em; }
      }

      #intro-tagline {
        margin-top: 0.6em;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: clamp(11px, 1.4vw, 14px);
        font-weight: 400;
        letter-spacing: 0.32em;
        color: #e6ab84;
        opacity: 0;
        animation: intro-logo-fade 1.1s cubic-bezier(.3, 0, .2, 1) .45s forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        #intro-splash { transition-duration: .15s; }
        .intro-streak { animation-duration: .2s; animation-delay: 0s; }
        #intro-logo { animation-duration: .2s; animation-delay: 0s; }
      }
    </style>
  </head>
  <body>
    <div id="intro-splash">
      <div class="intro-streak" style="--angle:-62deg; --len:34vmin; --delay:0s"></div>
      <div class="intro-streak" style="--angle:-28deg; --len:42vmin; --delay:.08s"></div>
      <div class="intro-streak" style="--angle:-8deg;  --len:30vmin; --delay:.18s"></div>
      <div class="intro-streak" style="--angle:18deg;  --len:46vmin; --delay:.05s"></div>
      <div class="intro-streak" style="--angle:46deg;  --len:36vmin; --delay:.22s"></div>
      <div class="intro-streak" style="--angle:78deg;  --len:40vmin; --delay:.12s"></div>
      <div id="intro-logo-wrap">
        <div id="intro-logo">THYNORA</div>
        <div id="intro-tagline">Think Beyond.</div>
      </div>
    </div>
    <div id="root"></div>
    <!-- 起動演出を「固定1.75秒で消す」のではなく、(a)最低表示時間 と
         (b)アプリが実際にroot配下へ描画完了したこと の両方を待って消す。
         こうしないと、読み込みが遅い回線・端末では演出のほうが先に終わってしまい、
         本体はまだ真っ白(スタイル未適用)のまま、というバグ("起動演出の後に
         白塗りになる")が起きる。MAX_MSは、万一アプリの起動に失敗した場合でも
         演出が消えないまま残り続けないための安全装置。
         type="module"のスクリプト(main.jsx)はdocument parse後まで実行が
         遅延されるので、このスクリプトを先に置いておけばMutationObserverの
         登録がroot描画より必ず先に間に合う。 -->
    <script>
      (function () {
        var splash = document.getElementById('intro-splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var MIN_MS = reduceMotion ? 150 : 1750;
        var MAX_MS = 6000;
        var minTimeElapsed = false;
        var appReady = false;
        var hidden = false;

        function hide() {
          if (hidden) return;
          hidden = true;
          splash.classList.add('intro-splash-hidden');
        }

        function tryHide() {
          if (minTimeElapsed && appReady) hide();
        }

        setTimeout(function () { minTimeElapsed = true; tryHide(); }, MIN_MS);
        setTimeout(hide, MAX_MS);

        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            appReady = true;
            observer.disconnect();
            tryHide();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
